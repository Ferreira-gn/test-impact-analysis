name: Main full suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Run full test suite
        run: |
          mkdir -p reports
          start=$(date +%s%3N)
          npm run test:ci
          end=$(date +%s%3N)
          printf '{"strategy":"full-suite","testDurationMs":%s}\n' "$((end-start))" > reports/full-suite.json
      - uses: actions/upload-artifact@v4
        with:
          name: full-suite-report
          path: reports/
