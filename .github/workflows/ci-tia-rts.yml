name: TIA RTS

on:
  push:
    branches: [experiment/tia-rts]
  pull_request:
    branches: [experiment/tia-rts]

permissions:
  contents: read

jobs:
  affected-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Select and run affected tests
        env:
          TIA_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: npm run test:affected
      - name: Compare full suite with TIA/RTS
        env:
          BENCHMARK_REPEATS: 3
          TIA_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: npm run benchmark
      - uses: actions/upload-artifact@v4
        with:
          name: tia-rts-report
          path: reports/
