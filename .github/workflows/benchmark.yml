name: TIA RTS benchmark

on:
  workflow_dispatch:
    inputs:
      repeats:
        description: 'Odd number of measured repetitions'
        required: false
        default: '5'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: corepack enable
      - run: corepack prepare pnpm@10.17.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Run benchmark
        env:
          BENCHMARK_REPEATS: ${{ inputs.repeats }}
          TIA_BASE: HEAD^
        run: pnpm benchmark
      - uses: actions/upload-artifact@v4
        with:
          name: tia-rts-benchmark
          path: reports/
